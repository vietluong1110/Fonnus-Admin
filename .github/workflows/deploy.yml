# Push to main: run the four gates, build the image, push it to GHCR tagged by the
# full commit SHA, then swap the console on the VPS. The same shape as the pipeline
# repo's workflow (../Fonnus/.github/workflows/deploy.yml), minus what has no
# equivalent here: one image, and no scratch database — the suites are pure.
name: deploy

on:
  push:
    branches: [main]

# Read-only by default. Only build-admin may push to GHCR: the test job runs
# every dependency's install scripts, and a token that can overwrite an image tag
# the box rolls back to must not be in reach of them.
permissions:
  contents: read

# One deploy at a time, and never cancel one in flight: a cancelled run can leave
# the box mid-swap.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ADMIN_IMAGE: ghcr.io/voidkeishi/fonnus-admin

jobs:
  test:
    runs-on: ubuntu-latest
    # This repo and the pipeline are checked out side by side, so `../Fonnus`
    # resolves from this repo's root exactly as it does on a laptop.
    defaults:
      run:
        working-directory: Fonnus-Admin
    steps:
      - uses: actions/checkout@v4
        with:
          path: Fonnus-Admin
      # The pipeline, where every drift test looks for it (contract hash, price
      # table, flat keys, document, glossary, tokens). Without it those suites
      # skip themselves and CI would pass on a console that no longer matches
      # the pipeline. The token reads the private repo and nothing else, and is
      # not left in .git/config for the install scripts below to find. An unset
      # secret reads as empty, and checkout would only say "token not supplied".
      - name: Check the pipeline read token is set
        env:
          FONNUS_READ_TOKEN: ${{ secrets.FONNUS_READ_TOKEN }}
        run: |
          test -n "$FONNUS_READ_TOKEN" || { echo "::error::the repository secret FONNUS_READ_TOKEN is not set; create it as docs/deploy.md §1.1 describes"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: VoidKeishi/Fonnus
          path: Fonnus
          token: ${{ secrets.FONNUS_READ_TOKEN }}
          persist-credentials: false
      - name: Check the pipeline sits where the drift tests look
        run: |
          test -f ../Fonnus/docs/read-contract.md || { echo "::error::../Fonnus/docs/read-contract.md is missing, so every drift test would skip"; exit 1; }
      # Version comes from package.json's packageManager field — one pin, kept in
      # step with the Dockerfile.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Fonnus-Admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Fonnus-Admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      # Needs egress to fonts.googleapis.com: next/font downloads the three faces
      # at build time.
      - run: pnpm build

  build-admin:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.ADMIN_IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

  deploy:
    needs: build-admin
    # A repository variable, not an environment one: this `if` is evaluated before
    # the job enters the environment (../Fonnus/docs/runbook.md §6.2).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key, never ssh-keyscan: keyscan-at-deploy-time trusts
          # whatever answers, which is no host verification at all.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Never fall back to password auth. Without this, a rejected key makes
          # ssh try the password three times against an absent tty and die on the
          # box's MaxAuthTries with "Too many authentication failures", which hides
          # the real cause; with it the run fails at once on "Permission denied
          # (publickey)".
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentitiesOnly yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config
      # An empty VPS_USER makes the scp target "@host", so ssh silently uses the
      # runner's own login name and authentication fails for a reason no log line
      # names. Check both before the first connection.
      - name: Check the deploy target is configured
        env:
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          test -n "$VPS_USER" || { echo "::error::variable VPS_USER is unset in the production environment (expected: deploy)"; exit 1; }
          test -n "$VPS_HOST" || { echo "::error::variable VPS_HOST is unset in the production environment"; exit 1; }
      # Compose file, deploy script and Caddyfile only. The live .env and
      # caddy/users are hand-maintained on the box and never travel through CI.
      # The target reaches the scripts as environment, never as `${{ }}` spliced
      # into the script text, so a variable's value is data and not shell.
      - name: Copy compose file, deploy script and Caddyfile
        env:
          TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key compose.yml ops/deploy.sh "$TARGET:~/fonnus-admin/"
          scp -i ~/.ssh/deploy_key caddy/Caddyfile "$TARGET:~/fonnus-admin/caddy/"
      - name: Deploy
        env:
          TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            "cd ~/fonnus-admin && ADMIN_IMAGE_TAG=$GITHUB_SHA bash deploy.sh"
